{% extends "base.html" %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-graph-up-arrow me-2"></i>12-Monats-Prognose</h4>

<!-- Was wäre wenn -->
<div class="card mb-4">
    <div class="card-header bg-white" role="button" data-bs-toggle="collapse" data-bs-target="#whatIfPanel">
        <h5 class="mb-0">
            <i class="bi bi-sliders me-2"></i>Was wäre wenn...
            <i class="bi bi-chevron-down float-end"></i>
        </h5>
    </div>
    <div class="collapse" id="whatIfPanel">
        <div class="card-body">
            <!-- Global overrides -->
            <div class="row g-3">
                <div class="col-6 col-md-4">
                    <label class="form-label"><small>Sparrate</small></label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="wi_sparrate" class="form-control" step="50">
                        <span class="input-group-text">&euro;</span>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label"><small>ETF-Sparplan</small></label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="wi_etf_rate" class="form-control" step="25">
                        <span class="input-group-text">&euro;</span>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label"><small>ETF-Rendite</small></label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="wi_return_pct" class="form-control" step="0.5">
                        <span class="input-group-text">%</span>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label"><small>Var. Ausgaben</small></label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="wi_var_expenses" class="form-control" step="50">
                        <span class="input-group-text">&euro;</span>
                    </div>
                </div>
            </div>

            <!-- Scenario Events -->
            <hr class="my-3">
            <h6 class="mb-3"><i class="bi bi-calendar-event me-1"></i>Szenarien</h6>
            <div id="eventList"></div>
            <div class="row g-2 align-items-end mt-1">
                <div class="col-6 col-md-3">
                    <label class="form-label"><small>Beschreibung</small></label>
                    <input type="text" id="ev_desc" class="form-control form-control-sm" placeholder="z.B. Gehaltserhöhung">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label"><small>Betrag (&euro;)</small></label>
                    <input type="number" id="ev_amount" class="form-control form-control-sm" step="50" min="0">
                </div>
                <div class="col-4 col-md-2">
                    <label class="form-label"><small>Ab / Im Monat</small></label>
                    <select id="ev_month" class="form-select form-select-sm"></select>
                </div>
                <div class="col-4 col-md-2">
                    <label class="form-label"><small>Typ</small></label>
                    <select id="ev_type" class="form-select form-select-sm">
                        <option value="income">Einnahme</option>
                        <option value="expense">Ausgabe</option>
                    </select>
                </div>
                <div class="col-4 col-md-1">
                    <label class="form-label"><small>Laufend</small></label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ev_recurring">
                    </div>
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-outline-primary btn-sm w-100" id="evAdd">
                        <i class="bi bi-plus-lg me-1"></i>Hinzufügen
                    </button>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-finance btn-sm" id="wiApply">
                    <i class="bi bi-play-fill me-1"></i>Simulieren
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="wiReset">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Zurücksetzen
                </button>
                <span class="text-muted small align-self-center ms-2" id="wiStatus"></span>
            </div>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="row g-3 mb-4">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-bar-chart me-2"></i>Kontostände</h5>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="accountChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-pie-chart me-2"></i>Ausgabenverteilung</h5>
            </div>
            <div class="card-body">
                <canvas id="expenseChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Prognosis Table -->
<div class="card">
    <div class="card-header bg-white">
        <h5 class="mb-0"><i class="bi bi-table me-2"></i>Monatliche Übersicht</h5>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0" id="prognosisTable">
            <thead class="table-light">
                <tr>
                    <th>Monat</th>
                    <th class="text-end d-none d-md-table-cell">Einnahmen</th>
                    <th class="text-end d-none d-md-table-cell">Ausgaben</th>
                    <th class="text-end d-none d-md-table-cell">Var. Ausg.</th>
                    <th class="text-end d-none d-md-table-cell">Sonder</th>
                    <th class="text-end">Nutzkonto</th>
                    <th class="text-end">Sparkonto</th>
                    <th class="text-end">ETF</th>
                    <th class="text-end">ETF-Ertrag</th>
                    <th class="text-end">Gesamt</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
(function() {
    var isMobile = window.innerWidth < 768;
    var accountChart = null;
    var pieChart = null;
    var defaults = null;
    var events = [];

    var COLORS = {
        nutzkonto: '#00838f',
        sparkonto: '#1565c0',
        anlegekonto: '#6a1b9a',
    };

    function fmt(val) {
        return val.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
    }

    // Populate month selector with next 13 months
    var monthSelect = document.getElementById('ev_month');
    var now = new Date();
    for (var i = 0; i < 13; i++) {
        var mm = (now.getMonth() + i) % 12 + 1;
        var yy = now.getFullYear() + Math.floor((now.getMonth() + i) / 12);
        var opt = document.createElement('option');
        opt.value = mm + '-' + yy;
        opt.textContent = (mm < 10 ? '0' : '') + mm + '/' + yy;
        monthSelect.appendChild(opt);
    }

    function renderEvents() {
        var el = document.getElementById('eventList');
        if (events.length === 0) { el.innerHTML = ''; return; }
        var html = '<div class="mb-2">';
        events.forEach(function(ev, idx) {
            var badge = ev.type === 'income'
                ? '<span class="badge bg-success">Einnahme</span>'
                : '<span class="badge bg-danger">Ausgabe</span>';
            var recLabel = ev.recurring ? 'ab' : 'im';
            var monthLabel = (ev.month < 10 ? '0' : '') + ev.month + '/' + ev.year;
            html += '<div class="d-flex align-items-center gap-2 mb-1 py-1 px-2 rounded" style="background:#f8f9fa;">' +
                badge +
                '<span class="flex-grow-1"><strong>' + ev.desc + '</strong> — ' + fmt(ev.amount) + ' ' + recLabel + ' ' + monthLabel +
                (ev.recurring ? ' <i class="bi bi-arrow-repeat text-muted" title="Laufend"></i>' : '') + '</span>' +
                '<button class="btn btn-sm btn-link text-muted p-0 ev-remove" data-idx="' + idx + '"><i class="bi bi-x-lg"></i></button>' +
                '</div>';
        });
        html += '</div>';
        el.innerHTML = html;
        el.querySelectorAll('.ev-remove').forEach(function(btn) {
            btn.addEventListener('click', function() {
                events.splice(parseInt(this.dataset.idx), 1);
                renderEvents();
            });
        });
    }

    document.getElementById('evAdd').addEventListener('click', function() {
        var desc = document.getElementById('ev_desc').value.trim();
        var amount = parseFloat(document.getElementById('ev_amount').value);
        var monthVal = document.getElementById('ev_month').value.split('-');
        var type = document.getElementById('ev_type').value;
        var recurring = document.getElementById('ev_recurring').checked;

        if (!desc || !amount || amount <= 0) return;

        events.push({
            desc: desc,
            amount: amount,
            month: parseInt(monthVal[0]),
            year: parseInt(monthVal[1]),
            type: type,
            recurring: recurring,
        });
        renderEvents();
        document.getElementById('ev_desc').value = '';
        document.getElementById('ev_amount').value = '';
        document.getElementById('ev_recurring').checked = false;
    });

    function buildPayload() {
        var payload = {};
        var sr = document.getElementById('wi_sparrate').value;
        var er = document.getElementById('wi_etf_rate').value;
        var rp = document.getElementById('wi_return_pct').value;
        var ve = document.getElementById('wi_var_expenses').value;

        if (sr !== '' && defaults && parseFloat(sr) !== defaults.sparrate) payload.sparrate = parseFloat(sr);
        if (er !== '' && defaults && parseFloat(er) !== defaults.etf_rate) payload.etf_rate = parseFloat(er);
        if (rp !== '' && defaults && parseFloat(rp) !== defaults.return_pct) payload.return_pct = parseFloat(rp);
        if (ve !== '' && defaults && parseFloat(ve) !== defaults.var_expenses) payload.var_expenses = parseFloat(ve);

        if (events.length > 0) {
            payload.events = events.map(function(ev) {
                return {
                    amount: ev.amount,
                    month: ev.month,
                    year: ev.year,
                    type: ev.type,
                    recurring: ev.recurring,
                };
            });
        }

        return payload;
    }

    function hasSimulation(payload) {
        return Object.keys(payload).length > 0;
    }

    function loadPrognosis(payload) {
        var opts = {};
        if (payload && Object.keys(payload).length > 0) {
            opts = {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            };
        }

        fetch('/api/prognosis', opts)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!defaults) {
                    defaults = data.defaults;
                    document.getElementById('wi_sparrate').value = defaults.sparrate;
                    document.getElementById('wi_etf_rate').value = defaults.etf_rate;
                    document.getElementById('wi_return_pct').value = defaults.return_pct;
                    document.getElementById('wi_var_expenses').value = defaults.var_expenses;
                }

                var months = data.months;
                var labels = months.map(function(m) { return m.label; });

                // Account Chart
                if (accountChart) {
                    accountChart.data.labels = labels;
                    accountChart.data.datasets[0].data = months.map(function(m) { return m.nutzkonto; });
                    accountChart.data.datasets[1].data = months.map(function(m) { return m.sparkonto; });
                    accountChart.data.datasets[2].data = months.map(function(m) { return m.anlegekonto; });
                    accountChart.update();
                } else {
                    var ctxAcc = document.getElementById('accountChart').getContext('2d');
                    accountChart = new Chart(ctxAcc, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Nutzkonto',
                                    data: months.map(function(m) { return m.nutzkonto; }),
                                    borderColor: COLORS.nutzkonto,
                                    backgroundColor: COLORS.nutzkonto + '20',
                                    fill: true, tension: 0.3,
                                },
                                {
                                    label: 'Sparkonto',
                                    data: months.map(function(m) { return m.sparkonto; }),
                                    borderColor: COLORS.sparkonto,
                                    backgroundColor: COLORS.sparkonto + '20',
                                    fill: true, tension: 0.3,
                                },
                                {
                                    label: 'Anlegekonto (ETF)',
                                    data: months.map(function(m) { return m.anlegekonto; }),
                                    borderColor: COLORS.anlegekonto,
                                    backgroundColor: COLORS.anlegekonto + '20',
                                    fill: true, tension: 0.3,
                                },
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { intersect: false, mode: 'index' },
                            plugins: {
                                legend: { position: 'top' },
                                tooltip: {
                                    callbacks: {
                                        label: function(ctx) {
                                            return ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString('de-DE', {minimumFractionDigits: 2}) + ' €';
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { ticks: { maxRotation: 45, minRotation: 45 } },
                                y: {
                                    title: { display: !isMobile, text: 'Euro (€)' },
                                    ticks: { callback: function(val) { return val.toLocaleString('de-DE') + ' €'; } }
                                }
                            }
                        }
                    });
                }

                // Pie Chart (only on first load)
                if (!pieChart) {
                    var ccData = data.cost_centers;
                    if (ccData.length > 0) {
                        var pieColors = ['#1a237e', '#283593', '#3949ab', '#5c6bc0', '#7986cb', '#9fa8da', '#c5cae9', '#e8eaf6'];
                        var sliceColors = ccData.map(function(c, i) {
                            return c.name.indexOf('Tagebuch') >= 0 ? '#e65100' : pieColors[i % pieColors.length];
                        });
                        var ctxPie = document.getElementById('expenseChart').getContext('2d');
                        pieChart = new Chart(ctxPie, {
                            type: 'doughnut',
                            data: {
                                labels: ccData.map(function(c) { return c.name; }),
                                datasets: [{
                                    data: ccData.map(function(c) { return c.amount; }),
                                    backgroundColor: sliceColors,
                                    borderWidth: 2, borderColor: '#fff',
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: { position: 'bottom', labels: { padding: 12 } },
                                    tooltip: {
                                        callbacks: {
                                            label: function(ctx) {
                                                return ctx.label + ': ' + ctx.parsed.toLocaleString('de-DE', {minimumFractionDigits: 2}) + ' €';
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    } else {
                        document.getElementById('expenseChart').parentElement.innerHTML =
                            '<p class="text-muted text-center py-4">Noch keine Ausgaben vorhanden.</p>';
                    }
                }

                // Table
                var tbody = document.querySelector('#prognosisTable tbody');
                tbody.innerHTML = '';
                months.forEach(function(m, i) {
                    var total = m.nutzkonto + m.sparkonto + m.anlegekonto;
                    var scenarioCell = '';
                    if (m.scenario && m.scenario !== 0) {
                        scenarioCell = '<span class="' + (m.scenario > 0 ? 'text-income' : 'text-expense') + '">' + fmt(m.scenario) + '</span>';
                    } else {
                        scenarioCell = '-';
                    }
                    var row = '<tr' + (i === 0 ? ' class="table-active"' : '') + '>' +
                        '<td><strong>' + m.label + '</strong>' + (i === 0 ? ' <span class="badge bg-primary">Aktuell</span>' : '') + '</td>' +
                        '<td class="text-end text-income d-none d-md-table-cell">' + fmt(m.income) + '</td>' +
                        '<td class="text-end text-expense d-none d-md-table-cell">' + fmt(m.expenses) + '</td>' +
                        '<td class="text-end d-none d-md-table-cell" style="color:#e65100">' + fmt(m.var_expenses) + '</td>' +
                        '<td class="text-end d-none d-md-table-cell">' + (m.boost !== 0 ? '<span class="' + (m.boost > 0 ? 'text-income' : 'text-expense') + '">' + fmt(m.boost) + '</span>' : '-') + '</td>' +
                        '<td class="text-end">' + fmt(m.nutzkonto) + '</td>' +
                        '<td class="text-end">' + fmt(m.sparkonto) + '</td>' +
                        '<td class="text-end">' + fmt(m.anlegekonto) + '</td>' +
                        '<td class="text-end text-invest">' + fmt(m.etf_return) + '</td>' +
                        '<td class="text-end fw-bold">' + fmt(total) + '</td>' +
                        '</tr>';
                    tbody.insertAdjacentHTML('beforeend', row);
                });

                if (payload && Object.keys(payload).length > 0) {
                    document.getElementById('wiStatus').textContent = 'Simulation aktiv';
                    document.getElementById('wiStatus').style.color = '#6a1b9a';
                } else {
                    document.getElementById('wiStatus').textContent = '';
                }
            });
    }

    // Initial load
    loadPrognosis(null);

    // Simulieren
    document.getElementById('wiApply').addEventListener('click', function() {
        var payload = buildPayload();
        loadPrognosis(hasSimulation(payload) ? payload : null);
    });

    // Zurücksetzen
    document.getElementById('wiReset').addEventListener('click', function() {
        if (defaults) {
            document.getElementById('wi_sparrate').value = defaults.sparrate;
            document.getElementById('wi_etf_rate').value = defaults.etf_rate;
            document.getElementById('wi_return_pct').value = defaults.return_pct;
            document.getElementById('wi_var_expenses').value = defaults.var_expenses;
        }
        events = [];
        renderEvents();
        loadPrognosis(null);
    });
})();
</script>
{% endblock %}
