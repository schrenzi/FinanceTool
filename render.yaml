databases:
  - name: finance-db
    plan: free

services:
  - type: web
    name: finance-prognosis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
